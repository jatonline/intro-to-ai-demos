<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Network Demos</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, sans-serif;
    background: #f5f5f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  h1 { font-size: 1.1rem; color: #555; margin-bottom: 16px; letter-spacing: 0.05em; text-transform: uppercase; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 0;
    background: #e0e0e0;
    border-radius: 10px 10px 0 0;
    padding: 6px 6px 0;
  }

  .tab-btn {
    padding: 8px 20px;
    border: none;
    background: transparent;
    border-radius: 7px 7px 0 0;
    cursor: pointer;
    font-size: 0.9rem;
    color: #666;
    transition: background 0.15s, color 0.15s;
  }
  .tab-btn.active {
    background: white;
    color: #222;
    font-weight: 600;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.07);
  }
  .tab-btn:hover:not(.active) { background: #d0d0d0; }

  .card {
    background: white;
    border-radius: 0 10px 10px 10px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.10);
    padding: 28px;
    width: 100%;
    max-width: 860px;
  }

  .panel { display: none; }
  .panel.active { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }

  .controls {
    flex: 0 0 240px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .controls h2 { font-size: 1.4rem; color: #222; }

  .slider-group { display: flex; flex-direction: column; gap: 4px; }
  .slider-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.88rem;
    color: #444;
  }
  .slider-label span { font-weight: 600; color: #1a73e8; }

  input[type=range] {
    width: 100%;
    accent-color: #1a73e8;
    cursor: pointer;
  }

  .matrix-label { font-size: 0.88rem; color: #444; margin-bottom: 4px; }
  .matrix-table { border-collapse: collapse; font-size: 0.82rem; }
  .matrix-table th {
    padding: 3px 6px;
    color: #888;
    font-weight: 500;
    text-align: center;
    background: #f8f8f8;
  }
  .matrix-table td { padding: 3px 4px; }
  .matrix-table td:first-child { color: #888; font-weight: 500; padding-right: 6px; white-space: nowrap; }
  .matrix-table input[type=number] {
    width: 64px;
    padding: 3px 5px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 0.82rem;
    text-align: right;
  }
  .matrix-table input[type=number]:focus { outline: 2px solid #1a73e8; border-color: transparent; }

  .dropdown-group { display: flex; flex-direction: column; gap: 4px; }
  .dropdown-group label { font-size: 0.88rem; color: #444; }
  .dropdown-group select {
    padding: 5px 8px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 0.88rem;
    cursor: pointer;
    background: white;
  }
  .dropdown-group select:focus { outline: 2px solid #1a73e8; }

  .plot-container {
    flex: 1 1 auto;
    min-width: 0;
    border-radius: 6px;
    background: white;
  }

  .plot-container svg { display: block; border-radius: 6px; }

  .tick text { font-family: system-ui, sans-serif; }
</style>
</head>
<body>

<h1>Neural Network Interactive Demos</h1>

<div class="tabs">
  <button class="tab-btn active" data-tab="and">AND Gate</button>
  <button class="tab-btn" data-tab="xor">XOR Gate</button>
  <button class="tab-btn" data-tab="act">XOR with Activation</button>
</div>

<div class="card">
  <!-- AND Gate -->
  <div class="panel active" id="panel-and">
    <div class="controls">
      <h2>AND gate</h2>
      <div class="slider-group">
        <div class="slider-label">w₁ = <span id="and-w1-val">-0.30</span></div>
        <input type="range" id="and-w1" min="-2" max="2" step="0.01" value="-0.3">
      </div>
      <div class="slider-group">
        <div class="slider-label">w₂ = <span id="and-w2-val">0.30</span></div>
        <input type="range" id="and-w2" min="-2" max="2" step="0.01" value="0.3">
      </div>
      <div class="slider-group">
        <div class="slider-label">b = <span id="and-b-val">-0.20</span></div>
        <input type="range" id="and-b" min="-2" max="2" step="0.01" value="-0.2">
      </div>
    </div>
    <div class="plot-container" id="svg-and"></div>
  </div>

  <!-- XOR Gate -->
  <div class="panel" id="panel-xor">
    <div class="controls">
      <h2>XOR gate</h2>
      <div class="slider-group">
        <div class="slider-label">w₁ = <span id="xor-w1-val">-0.30</span></div>
        <input type="range" id="xor-w1" min="-2" max="2" step="0.01" value="-0.3">
      </div>
      <div class="slider-group">
        <div class="slider-label">w₂ = <span id="xor-w2-val">0.30</span></div>
        <input type="range" id="xor-w2" min="-2" max="2" step="0.01" value="0.3">
      </div>
      <div class="slider-group">
        <div class="slider-label">b = <span id="xor-b-val">-0.20</span></div>
        <input type="range" id="xor-b" min="-2" max="2" step="0.01" value="-0.2">
      </div>
    </div>
    <div class="plot-container" id="svg-xor"></div>
  </div>

  <!-- XOR with Activation -->
  <div class="panel" id="panel-act">
    <div class="controls">
      <h2>XOR with activation</h2>
      <div>
        <div class="matrix-label">Weights and biases</div>
        <table class="matrix-table">
          <thead>
            <tr>
              <th></th><th>x₁</th><th>x₂</th><th>b</th>
            </tr>
          </thead>
          <tbody id="matrix-body">
          </tbody>
        </table>
      </div>
      <div class="dropdown-group">
        <label for="act-fn">Activation function</label>
        <select id="act-fn">
          <option value="relu" selected>relu</option>
          <option value="sigmoid">sigmoid</option>
          <option value="tanh">tanh</option>
        </select>
      </div>
    </div>
    <div class="plot-container" id="svg-act"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
// ── Activation functions ──────────────────────────────────────────────────────
const activations = {
  sigmoid: x => 1 / (1 + Math.exp(-x)),
  relu:    x => Math.max(0, x),
  tanh:    x => Math.tanh(x),
};

// ── Layout constants ──────────────────────────────────────────────────────────
const M = { top: 44, right: 24, bottom: 52, left: 56 };
const SVG_W = 480, SVG_H = 380;
const plotW = SVG_W - M.left - M.right;
const plotH = SVG_H - M.top  - M.bottom;
const xMin = -0.5, xMax = 1.5, yMin = -0.5, yMax = 1.5;
const N = 200; // contour grid resolution

const xScale = d3.scaleLinear([xMin, xMax], [M.left, M.left + plotW]);
const yScale = d3.scaleLinear([yMin, yMax], [M.top + plotH, M.top]); // inverted

// ── geoTransform: grid [0,N) → SVG pixels ────────────────────────────────────
// Row 0 in the grid = yMax (top of plot). Both grid-y and SVG-y increase downward,
// so no sign flip is needed in the transform.
const projection = d3.geoTransform({
  point(gx, gy) {
    this.stream.point(
      M.left + gx / N * plotW,
      M.top  + gy / N * plotH
    );
  }
});
const pathGen = d3.geoPath(projection);

// ── Contour grid computation ──────────────────────────────────────────────────
function computeGrid(fn) {
  const values = new Float32Array(N * N);
  for (let row = 0; row < N; row++) {
    const x2 = yMax - row / (N - 1) * (yMax - yMin); // row 0 → yMax
    for (let col = 0; col < N; col++) {
      const x1 = xMin + col / (N - 1) * (xMax - xMin);
      values[row * N + col] = fn(x1, x2);
    }
  }
  return values;
}

// ── Build SVG scaffold (called once per panel) ────────────────────────────────
function buildGateSVG(containerId, class0, class1) {
  const svg = d3.select('#' + containerId)
    .append('svg')
    .attr('width', SVG_W)
    .attr('height', SVG_H);

  // Clip path — keeps contour fill inside the plot area
  svg.append('defs').append('clipPath')
    .attr('id', containerId + '-clip')
    .append('rect')
    .attr('x', M.left).attr('y', M.top)
    .attr('width', plotW).attr('height', plotH);

  // Class-0 background (gray)
  svg.append('rect')
    .attr('x', M.left).attr('y', M.top)
    .attr('width', plotW).attr('height', plotH)
    .attr('fill', 'rgba(160,160,160,0.35)');

  // Clipped group for contour fill + boundary
  const contourGroup = svg.append('g')
    .attr('clip-path', 'url(#' + containerId + '-clip)');

  // Grid lines
  [0, 1].forEach(tx => {
    svg.append('line')
      .attr('x1', xScale(tx)).attr('x2', xScale(tx))
      .attr('y1', M.top).attr('y2', M.top + plotH)
      .attr('stroke', '#e8e8e8').attr('stroke-width', 1);
  });
  [0, 1].forEach(ty => {
    svg.append('line')
      .attr('x1', M.left).attr('x2', M.left + plotW)
      .attr('y1', yScale(ty)).attr('y2', yScale(ty))
      .attr('stroke', '#e8e8e8').attr('stroke-width', 1);
  });

  // X axis
  svg.append('g')
    .attr('transform', `translate(0,${M.top + plotH})`)
    .call(
      d3.axisBottom(xScale)
        .tickValues([0, 1])
        .tickSizeOuter(0)
        .tickSizeInner(5)
    )
    .call(g => g.select('.domain').attr('stroke', '#333'))
    .call(g => g.selectAll('text')
      .style('font', '13px system-ui, sans-serif')
      .attr('fill', '#444'));

  // Y axis
  svg.append('g')
    .attr('transform', `translate(${M.left},0)`)
    .call(
      d3.axisLeft(yScale)
        .tickValues([0, 1])
        .tickSizeOuter(0)
        .tickSizeInner(5)
    )
    .call(g => g.select('.domain').attr('stroke', '#333'))
    .call(g => g.selectAll('text')
      .style('font', '13px system-ui, sans-serif')
      .attr('fill', '#444'));

  // Axis labels
  svg.append('text')
    .attr('x', xScale((xMin + xMax) / 2))
    .attr('y', SVG_H - 4)
    .attr('text-anchor', 'middle')
    .style('font', 'italic 14px Georgia, serif')
    .attr('fill', '#333')
    .text('x₁');

  svg.append('text')
    .attr('transform', `translate(14,${yScale((yMin + yMax) / 2)}) rotate(-90)`)
    .attr('text-anchor', 'middle')
    .style('font', 'italic 14px Georgia, serif')
    .attr('fill', '#333')
    .text('x₂');

  // Title (updated on each render)
  const titleEl = svg.append('text')
    .attr('x', M.left + plotW / 2)
    .attr('y', 8)
    .attr('text-anchor', 'middle')
    .attr('dominant-baseline', 'hanging')
    .style('font', 'bold 14px system-ui, sans-serif')
    .attr('fill', '#222');

  // Scatter — class 0 (blue circles)
  class0.forEach(([px, py]) => {
    svg.append('circle')
      .attr('cx', xScale(px)).attr('cy', yScale(py)).attr('r', 8)
      .attr('fill', '#2563eb').attr('stroke', '#1d4ed8').attr('stroke-width', 1.5);
  });

  // Scatter — class 1 (red upward triangles via d3.symbol)
  const triPath = d3.symbol().type(d3.symbolTriangle).size(210)();
  class1.forEach(([px, py]) => {
    svg.append('path')
      .attr('d', triPath)
      .attr('transform', `translate(${xScale(px)},${yScale(py)})`)
      .attr('fill', '#dc2626').attr('stroke', '#b91c1c').attr('stroke-width', 1.5);
  });

  // Legend
  const lx = M.left + plotW - 4;
  const ly = M.top + 8;

  svg.append('circle')
    .attr('cx', lx - 52).attr('cy', ly + 1).attr('r', 5)
    .attr('fill', '#2563eb').attr('stroke', '#1d4ed8').attr('stroke-width', 1);
  svg.append('text')
    .attr('x', lx).attr('y', ly + 1)
    .attr('text-anchor', 'end').attr('dominant-baseline', 'middle')
    .style('font', '12px system-ui, sans-serif').attr('fill', '#333')
    .text('Class 0');

  const smallTri = d3.symbol().type(d3.symbolTriangle).size(55)();
  svg.append('path')
    .attr('d', smallTri)
    .attr('transform', `translate(${lx - 52},${ly + 20})`)
    .attr('fill', '#dc2626').attr('stroke', '#b91c1c').attr('stroke-width', 1);
  svg.append('text')
    .attr('x', lx).attr('y', ly + 20)
    .attr('text-anchor', 'end').attr('dominant-baseline', 'middle')
    .style('font', '12px system-ui, sans-serif').attr('fill', '#333')
    .text('Class 1');

  return { contourGroup, titleEl };
}

// ── Update contour fill + boundary ────────────────────────────────────────────
const contourGen = d3.contours().size([N, N]);

function updateGate({ contourGroup, titleEl }, fn, threshold, titleStr) {
  const values = computeGrid(fn);
  const contours = contourGen.thresholds([threshold])(values);

  contourGroup.selectAll('path').remove();

  // White fill = class-1 region (fn >= threshold)
  contourGroup.selectAll('path.fill')
    .data(contours)
    .join('path')
    .attr('class', 'fill')
    .attr('d', pathGen)
    .attr('fill', 'white')
    .attr('stroke', 'none');

  // Black stroke = decision boundary
  contourGroup.selectAll('path.boundary')
    .data(contours)
    .join('path')
    .attr('class', 'boundary')
    .attr('d', pathGen)
    .attr('fill', 'none')
    .attr('stroke', '#111')
    .attr('stroke-width', 2);

  titleEl.text(titleStr);
}

// ── AND gate ──────────────────────────────────────────────────────────────────
const andClass0 = [[0,1],[1,0],[0,0]];
const andClass1 = [[1,1]];
const andHandles = buildGateSVG('svg-and', andClass0, andClass1);

function renderAND() {
  const w1 = +document.getElementById('and-w1').value;
  const w2 = +document.getElementById('and-w2').value;
  const b  = +document.getElementById('and-b').value;

  let title;
  if (Math.abs(w2) > 1e-6) {
    title = `Decision boundary: x₂ = ${(-w1/w2).toFixed(2)}·x₁ + ${(-b/w2).toFixed(2)}`;
  } else if (Math.abs(w1) > 1e-6) {
    title = `Decision boundary: x₁ = ${(-b/w1).toFixed(2)}`;
  } else {
    title = 'Decision boundary: undefined (w₁=w₂=0)';
  }

  updateGate(andHandles, (x1, x2) => w1*x1 + w2*x2 + b, 0, title);
}

['and-w1','and-w2','and-b'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => {
    document.getElementById(id + '-val').textContent = parseFloat(el.value).toFixed(2);
    renderAND();
  });
});

// ── XOR gate ──────────────────────────────────────────────────────────────────
const xorClass0 = [[0,0],[1,1]];
const xorClass1 = [[1,0],[0,1]];
const xorHandles = buildGateSVG('svg-xor', xorClass0, xorClass1);

function renderXOR() {
  const w1 = +document.getElementById('xor-w1').value;
  const w2 = +document.getElementById('xor-w2').value;
  const b  = +document.getElementById('xor-b').value;

  let title;
  if (Math.abs(w2) > 1e-6) {
    title = `Decision boundary: x₂ = ${(-w1/w2).toFixed(2)}·x₁ + ${(-b/w2).toFixed(2)}`;
  } else if (Math.abs(w1) > 1e-6) {
    title = `Decision boundary: x₁ = ${(-b/w1).toFixed(2)}`;
  } else {
    title = 'Decision boundary: undefined (w₁=w₂=0)';
  }

  updateGate(xorHandles, (x1, x2) => w1*x1 + w2*x2 + b, 0, title);
}

['xor-w1','xor-w2','xor-b'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => {
    document.getElementById(id + '-val').textContent = parseFloat(el.value).toFixed(2);
    renderXOR();
  });
});

// ── XOR with activation ───────────────────────────────────────────────────────
const actClass0 = [[0,0],[1,1]];
const actClass1 = [[1,0],[0,1]];
const actHandles = buildGateSVG('svg-act', actClass0, actClass1);

const initWeights = [[1,1,0],[1,1,0],[1,1,0]];
const rowLabels = ['neuron 1','neuron 2','neuron 3'];

const matrixBody = document.getElementById('matrix-body');
initWeights.forEach((row, ri) => {
  const tr = document.createElement('tr');
  const th = document.createElement('td');
  th.textContent = rowLabels[ri];
  tr.appendChild(th);
  row.forEach((val, ci) => {
    const td = document.createElement('td');
    const inp = document.createElement('input');
    inp.type = 'number'; inp.step = '0.1'; inp.value = val;
    inp.id = `w_${ri}_${ci}`;
    inp.addEventListener('input', renderAct);
    td.appendChild(inp);
    tr.appendChild(td);
  });
  matrixBody.appendChild(tr);
});

document.getElementById('act-fn').addEventListener('change', renderAct);

function getWeights() {
  return initWeights.map((row, ri) =>
    row.map((_, ci) => parseFloat(document.getElementById(`w_${ri}_${ci}`).value) || 0)
  );
}

function renderAct() {
  const W = getWeights();
  const fn = activations[document.getElementById('act-fn').value];
  updateGate(
    actHandles,
    (x1, x2) => {
      const n1 = fn(W[0][0]*x1 + W[0][1]*x2 + W[0][2]);
      const n2 = fn(W[1][0]*x1 + W[1][1]*x2 + W[1][2]);
      return n1*W[2][0] + n2*W[2][1] + W[2][2];
    },
    0.5,
    'XOR with activation function'
  );
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'and') renderAND();
    else if (btn.dataset.tab === 'xor') renderXOR();
    else renderAct();
  });
});

// ── Initial render ────────────────────────────────────────────────────────────
renderAND();
</script>
</body>
</html>
