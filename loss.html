<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Network Demos</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, sans-serif;
    background: #f5f5f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  h1 { font-size: 1.1rem; color: #555; margin-bottom: 16px; letter-spacing: 0.05em; text-transform: uppercase; }

  .tabs {
    display: flex;
    gap: 4px;
    background: #e0e0e0;
    border-radius: 10px 10px 0 0;
    padding: 6px 6px 0;
  }

  .tab-btn {
    padding: 8px 22px;
    border: none;
    background: transparent;
    border-radius: 7px 7px 0 0;
    cursor: pointer;
    font-size: 0.9rem;
    color: #666;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .tab-btn.active { background: white; color: #222; font-weight: 600; box-shadow: 0 -2px 8px rgba(0,0,0,0.07); }
  .tab-btn:hover:not(.active) { background: #d0d0d0; }

  .card {
    background: white;
    border-radius: 0 10px 10px 10px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.10);
    padding: 28px;
    width: 100%;
    max-width: 900px;
  }

  .panel { display: none; }
  .panel.active { display: flex; gap: 20px; align-items: flex-start; }

  .controls {
    flex: 0 0 180px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .controls h2 { font-size: 1.3rem; color: #222; }

  .slider-group { display: flex; flex-direction: column; gap: 4px; }
  .slider-label { display: flex; justify-content: space-between; font-size: 0.88rem; color: #444; }
  .slider-label span { font-weight: 600; color: #1a73e8; min-width: 40px; text-align: right; }
  input[type=range] { width: 100%; accent-color: #1a73e8; cursor: pointer; }

  .stat { font-size: 1.05rem; font-weight: 600; color: #222; }
  .stat span { color: #d97706; }

  .plot-container { flex-shrink: 0; }
  .plot-container svg { display: block; border-radius: 6px; background: white; }

  .tick text { font-family: system-ui, sans-serif; }
</style>
</head>
<body>

<h1>Neural Network Interactive Demos</h1>

<div class="tabs">
  <button class="tab-btn active" data-tab="lin">Linear Fit</button>
  <button class="tab-btn" data-tab="loss">Loss Landscape</button>
</div>

<div class="card">

  <!-- Linear Fit -->
  <div class="panel active" id="panel-lin">
    <div class="controls">
      <h2>Tuning a linear fit</h2>
      <div class="slider-group">
        <div class="slider-label">weight <span id="lin-w-val">0.00</span></div>
        <input type="range" id="lin-w" min="-2" max="2" step="0.01" value="0">
      </div>
      <div class="slider-group">
        <div class="slider-label">bias <span id="lin-b-val">0.00</span></div>
        <input type="range" id="lin-b" min="-2" max="2" step="0.01" value="0">
      </div>
      <div class="stat">MSE = <span id="lin-mse">—</span></div>
    </div>
    <div class="plot-container" id="svg-lin"></div>
  </div>

  <!-- Loss Landscape -->
  <div class="panel" id="panel-loss">
    <div class="controls">
      <h2>Loss landscape</h2>
      <div class="slider-group">
        <div class="slider-label">weight <span id="loss-w-val">0.00</span></div>
        <input type="range" id="loss-w" min="-2" max="2" step="0.01" value="0">
      </div>
      <div class="slider-group">
        <div class="slider-label">bias <span id="loss-b-val">0.00</span></div>
        <input type="range" id="loss-b" min="-2" max="2" step="0.01" value="0">
      </div>
    </div>
    <div class="plot-container" id="svg-loss-fit"></div>
    <div class="plot-container" id="svg-loss-loss"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// ── Data ──────────────────────────────────────────────────────────────────────
const linX = [];
for (let xi = 0; xi < 13.1; xi = Math.round((xi + 0.2) * 10) / 10) linX.push(xi);
const linY = linX.map(xi => Math.sin(xi) + xi / 4);

// ── MSE helper ────────────────────────────────────────────────────────────────
function computeMSE(w, b) {
  return linX.reduce((sum, xi, i) => sum + (linY[i] - w * xi - b) ** 2, 0);
}

// ── Shared margins ────────────────────────────────────────────────────────────
const M = { top: 36, right: 24, bottom: 52, left: 64 };

// ── Build a linear-fit SVG (reused for both the main tab and loss-fit panel) ──
function buildLinearFitSVG(containerId, W, H, title) {
  const pW = W - M.left - M.right;
  const pH = H - M.top  - M.bottom;
  const xMin = 0, xMax = 13, yMin = -1, yMax = 4.7;

  const xs = d3.scaleLinear([xMin, xMax], [M.left, M.left + pW]);
  const ys = d3.scaleLinear([yMin, yMax], [M.top + pH, M.top]);

  const svg = d3.select('#' + containerId)
    .append('svg').attr('width', W).attr('height', H);

  // Clip path for prediction line
  svg.append('defs').append('clipPath')
    .attr('id', containerId + '-clip')
    .append('rect')
    .attr('x', M.left).attr('y', M.top)
    .attr('width', pW).attr('height', pH);

  // Grid lines
  [-1,0,1,2,3,4].forEach(ty => {
    svg.append('line')
      .attr('x1', M.left).attr('x2', M.left + pW)
      .attr('y1', ys(ty)).attr('y2', ys(ty))
      .attr('stroke', '#ececec').attr('stroke-width', 1);
  });
  [0,2,4,6,8,10,12].forEach(tx => {
    svg.append('line')
      .attr('x1', xs(tx)).attr('x2', xs(tx))
      .attr('y1', M.top).attr('y2', M.top + pH)
      .attr('stroke', '#ececec').attr('stroke-width', 1);
  });

  // Axes
  svg.append('g')
    .attr('transform', `translate(0,${M.top + pH})`)
    .call(d3.axisBottom(xs).tickValues([0,2,4,6,8,10,12]).tickSizeOuter(0))
    .call(g => g.select('.domain').attr('stroke', '#333'))
    .call(g => g.selectAll('text').style('font', '12px system-ui').attr('fill', '#444'));

  svg.append('g')
    .attr('transform', `translate(${M.left},0)`)
    .call(d3.axisLeft(ys).tickValues([-1,0,1,2,3,4]).tickSizeOuter(0))
    .call(g => g.select('.domain').attr('stroke', '#333'))
    .call(g => g.selectAll('text').style('font', '12px system-ui').attr('fill', '#444'));

  // Axis labels
  svg.append('text')
    .attr('x', xs(6.5)).attr('y', H - 6)
    .attr('text-anchor', 'middle')
    .style('font', 'italic 14px Georgia, serif').attr('fill', '#444').text('x');

  svg.append('text')
    .attr('transform', `translate(16,${ys(1.85)}) rotate(-90)`)
    .attr('text-anchor', 'middle')
    .style('font', 'italic 14px Georgia, serif').attr('fill', '#444').text('y');

  // Title
  svg.append('text')
    .attr('x', M.left + pW / 2).attr('y', 8)
    .attr('text-anchor', 'middle').attr('dominant-baseline', 'hanging')
    .style('font', 'bold 14px system-ui, sans-serif').attr('fill', '#222')
    .text(title);

  // Prediction line (dashed red, clipped)
  const predLine = svg.append('g')
    .attr('clip-path', 'url(#' + containerId + '-clip)')
    .append('line')
    .attr('stroke', '#dc2626').attr('stroke-width', 2)
    .style('stroke-dasharray', '6,4');

  // Data scatter (static)
  linX.forEach((xi, i) => {
    svg.append('circle')
      .attr('cx', xs(xi)).attr('cy', ys(linY[i])).attr('r', 4)
      .attr('fill', '#2563eb').attr('stroke', '#1d4ed8').attr('stroke-width', 1.2);
  });

  // Legend (top-right box)
  const legX = M.left + pW - 178, legY = M.top + 8;
  svg.append('rect')
    .attr('x', legX - 6).attr('y', legY - 5)
    .attr('width', 174).attr('height', 46)
    .attr('fill', 'rgba(255,255,255,0.9)').attr('stroke', '#ddd').attr('stroke-width', 1)
    .attr('rx', 3);

  svg.append('circle')
    .attr('cx', legX + 6).attr('cy', legY + 9).attr('r', 5)
    .attr('fill', '#2563eb').attr('stroke', '#1d4ed8').attr('stroke-width', 1.2);
  svg.append('text')
    .attr('x', legX + 16).attr('y', legY + 9)
    .attr('dominant-baseline', 'middle')
    .style('font', '12px system-ui').attr('fill', '#333').text('Sine function');

  svg.append('line')
    .attr('x1', legX).attr('x2', legX + 18)
    .attr('y1', legY + 28).attr('y2', legY + 28)
    .attr('stroke', '#dc2626').attr('stroke-width', 2)
    .style('stroke-dasharray', '5,3');

  const legendLabel = svg.append('text')
    .attr('x', legX + 22).attr('y', legY + 28)
    .attr('dominant-baseline', 'middle')
    .style('font', '12px system-ui').attr('fill', '#333');

  return { predLine, legendLabel, xs, ys, xMin, xMax };
}

// ── Update prediction line ────────────────────────────────────────────────────
function updatePredLine({ predLine, legendLabel, xs, ys, xMin, xMax }, w, b, labelStr) {
  predLine
    .attr('x1', xs(xMin)).attr('y1', ys(w * xMin + b))
    .attr('x2', xs(xMax)).attr('y2', ys(w * xMax + b));
  legendLabel.text(labelStr);
}

// ── Build loss landscape (Three.js 3D surface) ───────────────────────────────
function buildLossLandscape3D(containerId) {
  const W = 300, H = 356;
  const N = 50;
  const MSE_CAP = 6000;

  const wVals = Array.from({length: N}, (_, i) => -2 + i * 4 / (N - 1));
  const bVals = Array.from({length: N}, (_, i) => -2 + i * 4 / (N - 1));

  // Title div above canvas
  const wrapper = document.getElementById(containerId);
  const titleDiv = document.createElement('div');
  titleDiv.style.cssText = 'height:24px;line-height:24px;text-align:center;font:bold 14px system-ui,sans-serif;color:#222;';
  titleDiv.textContent = 'Loss landscape (drag to rotate)';
  wrapper.appendChild(titleDiv);

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  canvas.style.cssText = 'display:block;border-radius:6px;cursor:grab;';
  wrapper.appendChild(canvas);

  // Three.js setup
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0xffffff);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 100);
  camera.position.set(3, 2, 3);
  camera.lookAt(0, 0, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(3, 5, 3);
  scene.add(sun);

  // Pivot group — drag rotates this
  const pivot = new THREE.Group();
  pivot.rotation.y = 0.5;
  pivot.rotation.x = -0.3;
  scene.add(pivot);

  // Surface mesh with vertex colours
  // Coordinate space: x = weight*0.5 ∈ [-1,1], y = mse/MSE_CAP*2-1 ∈ [-1,1], z = bias*0.5 ∈ [-1,1]
  const colorScale = d3.scaleSequential(d3.interpolateYlOrRd).domain([0, MSE_CAP]);
  const posArr = new Float32Array(N * N * 3);
  const colArr = new Float32Array(N * N * 3);

  for (let bi = 0; bi < N; bi++) {
    for (let wi = 0; wi < N; wi++) {
      const idx = bi * N + wi;
      const mse = Math.min(computeMSE(wVals[wi], bVals[bi]), MSE_CAP);
      posArr[idx * 3]     = wVals[wi] * 0.5;
      posArr[idx * 3 + 1] = mse / MSE_CAP * 2 - 1;
      posArr[idx * 3 + 2] = bVals[bi] * 0.5;
      const c = new THREE.Color(colorScale(mse));
      colArr[idx * 3] = c.r; colArr[idx * 3 + 1] = c.g; colArr[idx * 3 + 2] = c.b;
    }
  }

  const triIdx = [];
  for (let bi = 0; bi < N - 1; bi++) {
    for (let wi = 0; wi < N - 1; wi++) {
      const a = bi * N + wi, b = a + 1, c = (bi + 1) * N + wi, d = c + 1;
      triIdx.push(a, b, c, b, d, c);
    }
  }

  const surfGeom = new THREE.BufferGeometry();
  surfGeom.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  surfGeom.setAttribute('color',    new THREE.BufferAttribute(colArr, 3));
  surfGeom.setIndex(triIdx);
  surfGeom.computeVertexNormals();
  pivot.add(new THREE.Mesh(surfGeom,
    new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide })));

  // Axis lines from floor corner (-1, -1, -1)
  [
    [[-1,-1,-1],[1,-1,-1]],   // weight (x)
    [[-1,-1,-1],[-1,-1,1]],  // bias   (z)
    [[-1,-1,-1],[-1,1,-1]],  // MSE    (y)
  ].forEach(([p1, p2]) => {
    const g = new THREE.BufferGeometry().setFromPoints(
      [p1, p2].map(p => new THREE.Vector3(...p)));
    pivot.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0x888888 })));
  });

  // Marker sphere
  const markerMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.07, 16, 8),
    new THREE.MeshPhongMaterial({ color: 0xdc2626, shininess: 100 }));
  pivot.add(markerMesh);

  // Drop line (2-point buffer, updated dynamically)
  const dropPos = new Float32Array(6);
  const dropGeom = new THREE.BufferGeometry();
  dropGeom.setAttribute('position', new THREE.BufferAttribute(dropPos, 3));
  pivot.add(new THREE.Line(dropGeom, new THREE.LineBasicMaterial({ color: 0x1d4ed8 })));

  function render() { renderer.render(scene, camera); }

  function updateMarker(w, b) {
    const mse = Math.min(computeMSE(w, b), MSE_CAP);
    const x = w * 0.5, y = mse / MSE_CAP * 2 - 1, z = b * 0.5;
    markerMesh.position.set(x, y, z);
    dropPos[0] = x; dropPos[1] = -1; dropPos[2] = z;
    dropPos[3] = x; dropPos[4] = y;  dropPos[5] = z;
    dropGeom.attributes.position.needsUpdate = true;
    render();
  }

  updateMarker(0, 0);

  // Drag to rotate
  let dragging = false, lx = 0, ly = 0;
  canvas.addEventListener('mousedown', e => {
    dragging = true; lx = e.clientX; ly = e.clientY;
    canvas.style.cursor = 'grabbing';
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    pivot.rotation.y += (e.clientX - lx) * 0.01;
    pivot.rotation.x = Math.max(-1.2, Math.min(0.3, pivot.rotation.x + (e.clientY - ly) * 0.01));
    lx = e.clientX; ly = e.clientY;
    render();
  });
  window.addEventListener('mouseup', () => { dragging = false; canvas.style.cursor = 'grab'; });

  return { update(w, b) { updateMarker(w, b); } };
}

// ── Setup canvases ────────────────────────────────────────────────────────────
const linHandles = buildLinearFitSVG('svg-lin', 640, 400, 'Tuning a linear fit');

let lossHandles = null; // built on first tab show

// ── Linear fit ────────────────────────────────────────────────────────────────
function renderLin() {
  const w = +document.getElementById('lin-w').value;
  const b = +document.getElementById('lin-b').value;
  document.getElementById('lin-mse').textContent = computeMSE(w, b).toFixed(2);
  updatePredLine(linHandles, w, b, `y = ${w.toFixed(2)}x + ${b.toFixed(2)}`);
}

['lin-w','lin-b'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => {
    document.getElementById(id + '-val').textContent = parseFloat(el.value).toFixed(2);
    renderLin();
  });
});

// ── Loss landscape ────────────────────────────────────────────────────────────
let lossFitHandles = null;

function renderLoss() {
  const w = +document.getElementById('loss-w').value;
  const b = +document.getElementById('loss-b').value;

  if (!lossHandles) {
    lossFitHandles = buildLinearFitSVG('svg-loss-fit', 300, 380, 'Linear fit');
    lossHandles = buildLossLandscape3D('svg-loss-loss');
  }

  updatePredLine(lossFitHandles, w, b, `y = ${w.toFixed(2)}x + ${b.toFixed(2)}`);
  lossHandles.update(w, b);
}

['loss-w','loss-b'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => {
    document.getElementById(id + '-val').textContent = parseFloat(el.value).toFixed(2);
    renderLoss();
  });
});

// ── Tabs ──────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    ({ lin: renderLin, loss: renderLoss })[btn.dataset.tab]();
  });
});

// ── Initial render ────────────────────────────────────────────────────────────
renderLin();
</script>
</body>
</html>
